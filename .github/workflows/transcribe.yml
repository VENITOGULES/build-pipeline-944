name: Transcribe voice memo

on:
  push:
    branches: [claude/transcription-summary-jzt34w]
    paths:
      - 'audio/**'
      - '.github/workflows/transcribe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install faster-whisper
        run: pip install faster-whisper

      - name: Transcribe
        run: python .github/workflows/transcribe.py

      - name: Upload transcript artifact
        uses: actions/upload-artifact@v4
        with:
          name: transcript
          path: transcription/

      - name: Commit transcript back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add transcription/
          if git diff --cached --quiet; then
            echo "No transcript changes to commit."
          else
            git commit -m "Add transcription output for voice memo [skip ci]"
            git push origin HEAD:claude/transcription-summary-jzt34w
          fi
